  <body>
    <header class="gnb">
      <nav class="">
        <a href="/">
          <img src="assets/images/logo.svg" alt="판다마켓 로고" />
        </a>
        <a class="btn-small-48 login-button" href="/pages/auth/login.html">로그인</a>
      </nav>
    </header>

    <main>
      <section class="landing-header">
        <div>
          <div class="landing-header-content">
            <h1 class="landing-heading">일상의 모든 물건을 거래해보세요</h1>
            <a href = "/items" class="btn-large">구경하러 가기</a>
          </div>
          <img src="assets/images/landing/landing-content-header.svg" alt="" />
        </div>
      </section>

      <div class="landing-body">
        <section class="landing-home">
          <img src="assets/images/landing/landing-content-home-1.svg" alt="" />
          <div class="landing-home-content w-274">
            <span>Hot item</span>
            <div>
              <h2 class="landing-heading">
                인기 상품을 확인해 보세요
              </h2>
              <p>
                가장 HOT한 중고거래 물품을<br />
                판다마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </section>
        <section class="landing-home landing-home--reverse">
          <img src="assets/images/landing/landing-content-home-2.svg" alt="" />
          <div class="landing-home-content w-288 landing-home-content--reverse">
            <span>Search</span>
            <div>
              <h2 class="landing-heading">
                구매를 원하는 상품을 검색하세요
              </h2>
              <p>구매하고 싶은 물품은 검색해서 <br />쉽게 찾아보세요</p>
            </div>
          </div>
        </section>
        <section class="landing-home">
          <img src="assets/images/landing/landing-content-home-3.svg" alt="" />
          <div class="landing-home-content w-335">
            <span>Register</span>
            <div>
              <h2 class="landing-heading">
                판매를 원하는 상품을 등록하세요
              </h2>
              <p>어떤 물건이든 판매하고 싶은 상품을 <br />쉽게 등록하세요</p>
            </div>
          </div>
        </section>
      </div>

      <section class="landing-footer">
        <div class = "landing-footer-content">
          <h1 class="landing-heading">믿을 수 있는 </br> 판다마켓 중고 거래</h1>
          <img src="assets/images/landing/landing-content-footer.svg" alt="" />
        </div>
      </section>
    </main>
      <footer class="footer">
        <div class = "footer-content">
          <p>@codeit - 2026</p>
          <div class = "footer-content-policy">
            <a href = "/privacy">Privacy Policy</a>

          </div>
          <ul class = "footer-content-icons">
            <li>
              <a href="https://www.facebook.com/" target="_blank">

              </a>
            </li>
            <li>
              <a href="https://www.twitter.com/" target="_blank">
                <img src="assets/icons/twitter-icon.svg" alt="트위터" />

            </li>

            </li>
            <li>
              <a href="https://www.instagram.com/" target="_blank">
                <img src="assets/icons/instagram-icon.svg" alt="인스타그램" />
