<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <header class="gnb">
      <nav class="">
        <a href="/">
          <img src="assets/images/logo.svg" alt="판다마켓 로고" />
        </a>
        <a class="btn-small-48 login-button" href="pages/login">로그인</a>
      </nav>
    </header>

    <main>
      <section class="landing-header">
        <div>
          <div class="landing-header-content">
            <h1 class="landing-heading">일상의 모든 물건을 거래해보세요</h1>
            <a href = "/items" class="btn-large">구경하러 가기</a>
          </div>
          <img src="assets/images/landing/landing-content-header.svg" alt="" />
        </div>
      </section>

      <div class="landing-body">
        <section class="landing-home">
          <img src="assets/images/landing/landing-content-home-1.svg" alt="" />
          <div class="landing-home-content w-274">
            <span>Hot item</span>
            <div>
              <h2 class="landing-heading">
                인기 상품을<br />
                확인해 보세요
              </h2>
              <p>
                가장 HOT한 중고거래 물품을<br />
                판다마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </section>
        <section class="landing-home">
          <div class="landing-home-content w-288 text-right">
            <span>Search</span>
            <div>
              <h2 class="landing-heading">
                구매를 원하는 <br />상품을 검색하세요
              </h2>
              <p>구매하고 싶은 물품은 검색해서 <br />쉽게 찾아보세요</p>
            </div>
          </div>
          <img src="assets/images/landing/landing-content-home-2.svg" alt="" />
        </section>
        <section class="landing-home">
          <img src="assets/images/landing/landing-content-home-3.svg" alt="" />
          <div class="landing-home-content w-335">
            <span>Register</span>
            <div>
              <h2 class="landing-heading">
                판매를 원하는 <br />상품을 등록하세요
              </h2>
              <p>어떤 물건이든 판매하고 싶은 상품을 <br />쉽게 등록하세요</p>
            </div>
          </div>
        </section>
      </div>

      <section class="landing-footer">
        <div class = "landing-footer-content">
          <h1 class="landing-heading">믿을 수 있는 </br> 판다마켓 중고 거래</h1>
          <img src="assets/images/landing/landing-content-footer.svg" alt="" />
        </div>
      </section>
    </main>
      <footer class="footer">
        <div class = "footer-content">
          <p>@codeit - 2024</p>
          <div class = "footer-content-policy">
            <a href = "/privacy">Privacy Policy</a>
            <a href = "/faq">FAQ</a>
          </div>
          <div class = "footer-content-icons">
            <a href = "facebook" target = "_blank">
              <img src = "assets/icons/facebook-icon.svg"/>
            </a>          
            <a href = "twitter" target = "_blank">
              <img src = "assets/icons/twitter-icon.svg"/>
            </a>
            <a href = "youtube" target = "_blank">
              <img src = "assets/icons/youtube-icon.svg"/>
            </a>
            <a href = "instagram" target = "_blank">
              <img src = "assets/icons/instagram-icon.svg"/>
            </a>
          </div>
        </div>
      </footer>
  </body>
</html>
